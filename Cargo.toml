[package]
name = "mahjong"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", features = ["dynamic_linking", "serialize", "wav", "mp3"] }
rand = "0.10.1"
bevy_egui = "0.39.1"
serde = "1.0.228"
toml = "1.1.2"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
